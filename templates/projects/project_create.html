{% extends 'base.html' %}
{% load static %}

{% block title %}Create Project - {{ block.super }}{% endblock %}

{% block content %}
<section class="project-create py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="display-5 fw-bold mb-4">Create New Project</h1>
                
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label">Project Name *</label>
                                    <input type="text" name="name" class="form-control" placeholder="Project name" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Description *</label>
                                    <textarea name="description" class="form-control" rows="5" placeholder="Describe your project..." required></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Service</label>
                                    <select name="service" class="form-select">
                                        <option value="">Select a service...</option>
                                        {% for service in form.fields.service.queryset %}
                                        <option value="{{ service.id }}">{{ service.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Package</label>
                                    <select name="package" class="form-select">
                                        <option value="">Select a package...</option>
                                        {% for package in form.fields.package.queryset %}
                                        <option value="{{ package.id }}">{{ package.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Installation Address *</label>
                                    <textarea name="installation_address" class="form-control" rows="3" placeholder="Full installation address" required></textarea>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Timeline *</label>
                                    <input type="text" name="timeline" class="form-control" placeholder="e.g., 2-3 weeks" required>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary w-100 py-2">
                                        <i class="fas fa-plus"></i> Create Project
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
