{% extends 'base.html' %}
{% load static %}

{% block title %}Access Denied - {{ block.super }}{% endblock %}

{% block content %}
<section class="error-page py-5" style="min-height:80vh;display:flex;align-items:center;">
    <div class="container">
        <div class="row justify-content-center text-center">
            <div class="col-lg-6">
                <h1 class="display-1 fw-bold text-warning">403</h1>
                <h2 class="fw-bold mb-3">Access Denied</h2>
                <p class="text-muted mb-4">You don't have permission to access this page.</p>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="{% url 'core:home' %}" class="btn btn-primary">
                        <i class="fas fa-home"></i> Go Home
                    </a>
                    {% if not user.is_authenticated %}
                    <a href="{% url 'login' %}" class="btn btn-outline-primary">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
