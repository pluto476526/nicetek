{% extends 'base.html' %}
{% load static %}

{% block title %}Unsubscribe - {{ block.super }}{% endblock %}

{% block content %}
<section class="unsubscribe-page py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm text-center">
                    <div class="card-body p-5">
                        <i class="fas fa-envelope-open-text text-warning" style="font-size:4rem;"></i>
                        <h2 class="fw-bold mt-3">Unsubscribe from Newsletter</h2>
                        <p class="text-muted">Enter your email address to unsubscribe from our newsletter.</p>
                        
                        <form method="post" action="{% url 'newsletter:unsubscribe' %}">
                            {% csrf_token %}
                            <div class="input-group mt-3">
                                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-times"></i> Unsubscribe
                                </button>
                            </div>
                        </form>
                        
                        <div class="mt-3">
                            <a href="{% url 'core:home' %}" class="text-decoration-none">
                                <i class="fas fa-arrow-left"></i> Back to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
