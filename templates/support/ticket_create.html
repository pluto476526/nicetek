{% extends 'base.html' %}
{% load static %}

{% block title %}Create Support Ticket - {{ block.super }}{% endblock %}

{% block content %}
<section class="ticket-create py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="display-5 fw-bold mb-4">Create Support Ticket</h1>
                
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label">Subject *</label>
                                    <input type="text" name="subject" class="form-control" placeholder="Brief subject" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Description *</label>
                                    <textarea name="description" class="form-control" rows="5" placeholder="Describe your issue in detail..." required></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Category *</label>
                                    <select name="category" class="form-select" required>
                                        <option value="">Select category...</option>
                                        <option value="technical">Technical Support</option>
                                        <option value="billing">Billing & Payment</option>
                                        <option value="installation">Installation Issue</option>
                                        <option value="general">General Inquiry</option>
                                        <option value="feature">Feature Request</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Priority</label>
                                    <select name="priority" class="form-select">
                                        <option value="low">Low</option>
                                        <option value="medium" selected>Medium</option>
                                        <option value="high">High</option>
                                        <option value="urgent">Urgent</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Related Project</label>
                                    <select name="project" class="form-select">
                                        <option value="">Select a project...</option>
                                        {% for project in form.fields.project.queryset %}
                                        <option value="{{ project.id }}">{{ project.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary w-100 py-2">
                                        <i class="fas fa-paper-plane"></i> Submit Ticket
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
